name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build installer bundle
        run: node scripts/build.js
      - name: Run core tests
        run: node scripts/test.js
      - name: Run v1.4 single-surface tests
        run: node scripts/test-v14.js
      - name: Run sheet and scheduler checks
        run: node scripts/test-scheduler.js
      - name: Run migration and storage checks
        run: node scripts/test-sheet-repair.js
      - name: Run app and job service tests
        run: node scripts/test-job-editor.js
      - name: Run playlist heartbeat tests
        run: node scripts/test-heartbeat.js
      - name: Run update checker behavior tests
        run: node scripts/test-update-checker.js
