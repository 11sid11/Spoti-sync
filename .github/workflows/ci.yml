name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build installer bundle
        run: node scripts/build.js
      - name: Run core tests
        run: node scripts/test.js
      - name: Run scheduler visibility checks
        run: node scripts/test-scheduler.js
