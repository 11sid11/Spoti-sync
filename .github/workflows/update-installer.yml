name: Publish installer artifact

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build.js'
      - '.github/workflows/update-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-artifact
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build installer
        run: node scripts/build.js
      - name: Run tests
        run: node scripts/test.js
      - name: Commit installer when changed
        shell: bash
        run: |
          if git diff --quiet -- docs/downloads/SpotiSync.gs; then
            echo "Installer is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/SpotiSync.gs
          git commit -m "update generated Apps Script installer"
          git push origin HEAD:main
